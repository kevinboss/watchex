name: Publish

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v1.0.6)
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    name: Release
    strategy:
      matrix:
        kind: ['windows', 'linux']
        include:
          - kind: windows
            os: windows-latest
            target: win-x64
          - kind: linux
            os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create build data
        shell: bash
        id: build-data
        run: |
          tag="$TAG"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "version=${tag:1}" >> $GITHUB_OUTPUT
          echo "release_name=watchex-$tag-${{ matrix.target }}" >> $GITHUB_OUTPUT

      - name: Build
        shell: bash
        run: |
          echo "dotnet publish src/Watchex/Watchex.csproj --self-contained --runtime "${{ matrix.target }}" -c Release -o "${{ steps.build-data.outputs.release_name }}" -p:Version=${{ steps.build-data.outputs.version }}"
          dotnet publish src/Watchex/Watchex.csproj --self-contained --runtime "${{ matrix.target }}" -c Release -o "${{ steps.build-data.outputs.release_name }}" -p:Version=${{ steps.build-data.outputs.version }}

      - name: Package Windows
        shell: bash
        run: |
          7z a -tzip "${{ steps.build-data.outputs.release_name }}.zip" "./${{ steps.build-data.outputs.release_name }}/*"
        if: ${{ matrix.target == 'win-x64'}}

      - name: Package Linux
        shell: bash
        run: |
          tar czvf "${{ steps.build-data.outputs.release_name }}.tar.gz" "${{ steps.build-data.outputs.release_name }}"
        if: ${{ matrix.target == 'linux-x64'}}

      - name: Delete output directory
        shell: bash
        run: |
          rm -r ${{ steps.build-data.outputs.release_name }}

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: "watchex*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  winget:
    name: WinGet
    needs: release
    runs-on: windows-latest
    steps:
      - name: Publish watchex to WinGet
        # Tracking @main: the @v2 tag misses the fix in 19e706d ("pwsh doesn't
        # sort sometimes") which makes max-versions-to-keep delete the newest
        # versions instead of the oldest.
        uses: vedantmgoyal2009/winget-releaser@main
        with:
          identifier: francWhite.watchex
          installers-regex: '\.zip$'
          release-tag: ${{ env.TAG }}
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}
